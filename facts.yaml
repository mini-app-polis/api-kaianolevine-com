# The figures this repository owns, computed into facts.json by `facts
# generate` (common-python-utils) and checked in CI by `facts check`.
# Facts are generated, never edited by hand.
repo: api-kaianolevine-com
facts:
  machine_principals:
    description: Machine principals declared in the identity registry
    matches:
      file: src/kaianolevine_api/identity_registry.py
      pattern: "\\bMachine\\("
  test_functions:
    description: Test functions in the test suites (def test_*, each parametrized function once)
    matches:
      file: tests/**/test_*.py
      pattern: '(?m)^\s*(?:async\s+)?def test_\w+'
