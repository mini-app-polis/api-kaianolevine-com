name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, pip-audit against the resolved dependency set, semgrep,
  # and a CycloneDX SBOM retained as a build artifact. The steps live in
  # mini-app-polis/.github so the pinned tool versions and the gating
  # decisions are in one place; see that repo's README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: python
      package-manager: uv

  test:
    runs-on: ubuntu-latest
    # Real Postgres, never SQLite (TEST-015): the integration suite builds
    # its schema from migrations/ with the deploy's own runner. The tests
    # refuse any database that is not local and named *_test (TEST-009).
    # pgvector's image, not plain postgres: migration 017 creates the
    # `vector` extension (001's pgcrypto ships with both).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaianolevine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaianolevine_test
      ENVIRONMENT: test
      KAIANO_API_OWNER_ID: dev-owner

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # CD-020. `uv sync` without --locked silently re-resolves when the
      # lockfile and pyproject.toml disagree, so a stale lock passes CI and
      # then fails the deploy, where `uv sync --locked` refuses the drift.
      # Checked here because this is where the failure is cheap to fix.
      - name: Verify the lockfile matches pyproject
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      # TEST-012. This repo holds the database, every cog's auth and the
      # dispatchers, and had never been typechecked.
      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

  release:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Conformance is graded when the repository changes, and this is where
  # that is said. The evaluation runs after this job ends, so what the job
  # reports is whether the request landed — never what was found.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
