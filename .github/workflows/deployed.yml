name: deployed

# Runs when Railway reports a deploy (Railway posts GitHub deployments; the
# environments are named "<project> / development" and "<project> /
# production", after the Railway environments — not "dev")
# and smoke-tests the API that just went live, in either environment
# (CD-032).
#
# "Just went live" is checked, not assumed. A deployment_status of success
# can arrive while the public hostname still routes to the deploy being
# replaced, and /health or a 401 answer the same from either. So the job
# first waits until /version reports the deployment's own commit, and
# confirms it again after the checks, so every probe in between is known to
# have met the new deploy. Railway only switches traffic once /health
# answers (healthcheckPath in .railway/railway.ts), which keeps that wait
# short.
#
# After a dev deploy it also asks every consumer that keeps a live contract
# suite to run it against the new API (TEST-016, ecosystem-standards ADR-0012):
#   common-python-utils — the cogs call this API through that library's
#     client, so their suite lives there, next to the catalog it checks;
#   website-astro-wcs, website-astro-software, website-astro-wcsmn — the
#     sites call it from the browser, not through that client, so each keeps
#     its own read-only suite;
#   ecosystem-standards — its release job publishes the standards catalog
#     here, so it keeps a read-only suite for that one call.
# Triggering on the deploy rather than on the push means the suite
# meets the new API, not the one it replaced. Production only gets the
# read-only smoke test: the contract suite writes data and never runs there.
#
# It asks once per commit that goes live in dev. A redeploy of the same
# commit (a variable change, a restart) is skipped when both hold:
#   - this deployment's latest earlier success-or-inactive status is a
#     success. Railway keeps one GitHub deployment per commit and
#     environment, adds a redeploy's statuses to it, and marks it inactive
#     when another commit goes live, so a commit that comes back after
#     another one is asked again;
#   - an earlier run of this workflow for the commit finished the step that
#     asks the consumers. Only a dev run whose smoke test passed gets there,
#     so a commit whose first deploy failed the smoke test is still asked
#     when a later redeploy passes, and a production run never counts.
# The contract job runs one at a time per commit, so redeploys that land
# together see each other's result. The smoke test still runs on every
# deploy.
#
# GitHub cannot filter deployment_status by state or environment, so the
# statuses Railway posts before a deploy finishes start a run that skips.
#
# The cross-repository trigger uses the promote GitHub App (the same org
# secrets as promote and automerge): a repository_dispatch needs a token
# with Contents: write on each consumer, which GITHUB_TOKEN never has.

on: deployment_status

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (endsWith(github.event.deployment.environment, '/ development') ||
       endsWith(github.event.deployment.environment, '/ production'))
    runs-on: ubuntu-latest
    env:
      API: ${{ endsWith(github.event.deployment.environment, '/ development') && 'https://dev-api.kaianolevine.com' || 'https://api.kaianolevine.com' }}
      SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Smoke-test the deployed API
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          serving() { curl -fsS --max-time 10 "$API/version" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true; }
          # Wait for the new deploy to be the one answering (up to 5 min).
          deadline=$(( $(date +%s) + 300 ))
          until [ "$(serving)" = "$SHA" ]; do
            [ "$(date +%s)" -lt "$deadline" ] \
              || fail "$API is still serving '$(serving)', not $SHA, 5 minutes after the deploy reported success."
            sleep 10
          done
          curl -fsS -o /dev/null "$API/health" \
            || fail "$API/health did not answer after the deploy."
          # A scoped route without a key must refuse with the error envelope
          # — a 500 here means the app is up but broken. Authentication runs
          # before the handler, so this touches no data.
          code=$(curl -sS -o body.json -w '%{http_code}' "$API/v1/wcs/wiki/export")
          [ "$code" = 401 ] || fail "$API/v1/wcs/wiki/export without a key answered $code, not 401."
          jq -e '.error.code | type == "string"' body.json >/dev/null \
            || fail "$API/v1/wcs/wiki/export answered 401 without the error envelope."
          # Still the new deploy — the probes above did not straddle a switch.
          [ "$(serving)" = "$SHA" ] \
            || fail "$API switched away from $SHA during the smoke test (now '$(serving)')."
          echo "API OK at $API ($SHA)"

  contract:
    needs: smoke
    if: endsWith(github.event.deployment.environment, '/ development')
    runs-on: ubuntu-latest
    concurrency:
      group: deployed-contract-${{ github.event.deployment.sha }}
      cancel-in-progress: false
    steps:
      - name: Check whether the consumers were already asked about this commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ github.event.deployment.id }}
          STATUS: ${{ github.event.deployment_status.id }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          set -uo pipefail
          # Any lookup that fails counts as not asked: a repeat ask is
          # harmless, a missed one is not.
          already_asked() {
            live=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses?per_page=100" \
              --jq "[.[] | select(.id < $STATUS and (.state == \"success\" or .state == \"inactive\"))] | sort_by(.id) | last | .state // \"none\"") \
              || return 1
            [ "$live" = success ] || return 1
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deployed.yml/runs?head_sha=$SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") \
              || return 1
            for run in $runs; do
              asked=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq '[.jobs[] | select(.name == "contract") | .steps[]? | select(.name == "Run the contract suites against the new API" and .conclusion == "success")] | length') \
                || continue
              [ "$asked" -gt 0 ] && return 0
            done
            return 1
          }
          if already_asked; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The contract consumers were already asked about $SHA, which is still live in dev; not asking again."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint an App token for the contract consumers
        if: steps.commit.outputs.new == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: mini-app-polis
          repositories: |
            common-python-utils
            website-astro-wcs
            website-astro-software
            website-astro-wcsmn
            ecosystem-standards
          permission-contents: write

      - name: Run the contract suites against the new API
        if: steps.commit.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          for repo in common-python-utils website-astro-wcs website-astro-software website-astro-wcsmn ecosystem-standards; do
            gh api "repos/mini-app-polis/$repo/dispatches" \
              -f event_type=dev-api-deployed \
              -f "client_payload[api_sha]=$SHA"
            echo "Asked $repo to run its contract suite against $SHA."
          done
