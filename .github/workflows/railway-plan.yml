# Plans .railway/railway.ts against production on every pull request into
# main that changes it; the plan is the job summary. Reading it is the
# review, and merging is the approval. A plan that destroys anything fails
# unless the pull request is labelled allow-destroy. The steps live in the
# shared workflow in mini-app-polis/.github, modelled on
# mini-app-polis/infra's terraform.yml.
name: Railway plan

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: adding or removing allow-destroy re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: [".railway/**", ".github/workflows/railway-plan.yml"]

permissions:
  contents: read

jobs:
  plan:
    uses: mini-app-polis/.github/.github/workflows/railway-plan.yml@v3
    secrets:
      # A project token for the ecosystem project's production environment.
      railway-token: ${{ secrets.RAILWAY_TOKEN }}
