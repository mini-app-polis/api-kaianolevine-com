# Which repositories the public status dashboard covers, and how they are
# shown. Committed rather than environment-held because "which repos are
# mine" is a reviewable decision with a diff, not a deployment knob — and
# because the private-repo disclosure setting below decides what a stranger
# can read off software.kaianolevine.com. That belongs in review.
#
# Served by GET /v1/github/status. Changing this file needs a deploy.

version: 1

# How long one fetched snapshot is served before GitHub is called again.
# Also the interval of the background refresh, so the board is never more
# than about this old. Sixty seconds shows a finished build within a minute,
# and at a few GraphQL points per refresh it spends well under 5% of the
# hourly budget. Lowered from 300 in Oct 2026: five minutes read as broken
# while watching a CI run land.
cache_ttl_seconds: 60

# Organizations to enumerate. One GraphQL query per org per refresh.
#
# ONE ENTRY, and adding a second is not a one-line change. A fine-grained
# personal access token is limited to a single resource owner — GitHub lists
# multi-org access as a known gap — so the token that reads this org cannot
# read another one. Adding `dance-geek-productions` here in Sep 2026 took the
# whole board to 502 for exactly that reason.
#
# To cover a second org, pick one first:
#   - a classic PAT (spans every org, but `repo` is read AND write, on a
#     token reachable from a public unauthenticated endpoint), or
#   - a token per org, which needs a code change here and in
#     services/github_dashboard.py, or
#   - a GitHub App installed on both orgs.
#
# Since Sep 2026 an unreadable org no longer blanks the board — it is skipped
# and reported in `unavailable_orgs`. That makes the mistake visible rather
# than fatal; it does not make the org readable.
orgs:
  - mini-app-polis

# Allowlist, "org/name". When non-empty, ONLY these repos are considered
# and every other filter below still applies to them. Normally empty.
include: []

# Repositories omitted entirely, "org/name". These are not listed, not
# counted, and not aggregated.
exclude: []

exclude_archived: true
exclude_forks: true

# How private repositories are represented on a public page.
#
#   aggregate — counted into a per-org summary; never named, no titles,
#               no URLs. The page can say "4 private repos, 1 failing"
#               without saying which.
#   hidden    — dropped before shaping. Not counted anywhere.
#   full      — listed exactly like public repos, and badged private on the
#               page. This route is unauthenticated, so `full` publishes
#               every listed repo's name, URL, description, language,
#               default branch and last-push time to anyone with the link.
#               Issue and pull-request titles are never fetched and so can
#               never appear, whatever this is set to.
#
# Set to `full` deliberately in Sep 2026: the fleet is the portfolio, and a
# repo you cannot name is not evidence of anything. The exposure that comes
# with it is the description field — review descriptions before adding a
# private repo, not after.
private_repos: full
