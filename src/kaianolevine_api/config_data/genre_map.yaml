# The catalog's genre vocabulary, and where every genre value the catalog
# has held goes in it. Agreed with the owner on 2026-11-05.
#
# Genre is two-level: a broad genre from `broad`, and an optional subgenre.
# Each key under `map` is a genre value as clean_genre leaves it (matched
# ignoring case, spaces and symbols); its value is one of:
#   [Broad, Subgenre]  the genre and subgenre it becomes (Subgenre may be null)
#   cleared            not a genre: the genre is cleared
#   version            not a genre but a version: it moves to the version

broad:
  - Pop
  - R&B/Soul
  - Hip-Hop
  - Dance/Electronic
  - Alternative/Indie
  - Rock
  - Blues
  - Country
  - Folk & Acoustic
  - Jazz
  - Funk/Disco
  - Latin & World
  - Soundtrack & Seasonal

