# Curated layer of the annual DJ summaries — GET /v1/stats/summaries/{year}.
#
# Every number on a year summary is computed from the sets in Postgres, so
# the current year's summary moves as sets are ingested. This file holds
# only what cannot be computed: the hand-written parts of the summaries
# published as Google Sheets for 2016–2022, before the pipeline existed.
#
#   hours_played  The published figure, shown in place of the computed one.
#                 Set where the source sheets carry no track lengths
#                 (2016–2018) or carry them as "00:3:48", which the ingest
#                 parser rejects (2019–2021) — either way the computed total
#                 would be missing or far too low. 2019–2021 are the sheets'
#                 exact totals rounded to the hour; 2022's sheet had none.
#   spotify_playlist_url  The year's summary playlist.
#   highlights    The sheet's "Stats" rows that are not computed headline
#                 numbers, verbatim — they reflect manual merging of
#                 versions and edits, so they may differ from the computed
#                 top lists, and are shown as the original summary.
#
# A year with no entry gets the computed summary alone.

years:
  2016:
    hours_played: "71+"
    spotify_playlist_url: https://open.spotify.com/playlist/1a4T776p4NQH8EtiB3xzG9
    highlights:
      - { label: Most Played Song 1, value: Missing You - Betty Who }
      - { label: Most Played Song 2, value: My House - Flo Rida }
      - { label: Most Played Artist, value: Betty Who }
      - { label: Most Songs by Artist, value: 6 (by Marian Hill) }
      - { label: Versions of No Diggity, value: "4" }
