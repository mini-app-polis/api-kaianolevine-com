[project]
name = "kaianolevine-api"
dynamic = ["version"]
description = "FastAPI service powering api.kaianolevine.com — sets, tracks, catalog, stats, evaluations, contact, and resume."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "boto3>=1.34,<2",
  "cryptography>=44.0.1,<51.0",
  "sentry-sdk[fastapi]>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "miniapppolis-common-utils>=6.25.0,<7",
  "miniapppolis-identity[store]>=2.2.0,<3",
  "pyjwt[crypto]>=2.8,<3.0",
  "anthropic>=0.40,<2.0",
  "openai>=1.40,<4.0",
  "pgvector>=0.3,<1.0",
  "tiktoken>=0.7,<1.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "mypy>=1.11.2",
  "pre-commit>=3.6,<5.0",
  "ruff>=0.7,<1.0",
  "pytest-xdist>=3.6,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kaianolevine_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaianolevine_api"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Every schema passes its default positionally, Field(True, ...), which
# mypy's dataclass_transform support does not read as a default. The plugin
# does, and it treats pydantic-settings fields as optional in __init__.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped engine's asyncpg
# connections cannot be used from a loop other than the one that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests/unit", "tests/integration"]

[tool.coverage.run]
# SQLAlchemy's async layer runs ORM code inside greenlets, which coverage
# does not follow by default: everything after a handler's first database
# call would read as never executed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# TEST-019: CI fails below this floor. Raise it as coverage rises; lowering it is a reviewed edit.
fail_under = 89

[tool.uv]
# The uv minor every lock in the fleet is written with. A range, not an exact
# pin: Dependabot runs its own single uv and refuses to update a repository
# whose pin excludes it, and it follows uv's patch releases. setup-uv reads
# this in CI and installs the newest uv inside the range; a uv outside it
# refuses to run instead of rewriting the lock's revision. Moving to a new
# minor is a fleet sweep: bump this everywhere, then re-lock, in commits of
# their own.
required-version = ">=0.13.0,<0.14"
