# api-kaianolevine-com / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: api-service

# No active deferrals.

exemptions:
  - rule: PY-011
    reason: "Intentional project name: kaianolevine_api. The repository is named api-kaianolevine-com by infrastructure convention but the Python project name reflects the product identity. Aligning them would require a breaking rename of the installed package."

  - rule: PY-013
    reason: "Deduplication is enforced at the database layer via UniqueConstraint (e.g. uq_sets_owner_source_file on Set, uq_wcs_note_grants_user_note on WcsNoteGrant). The check's 'possible_duplicate_' filename-prefix pattern applies to file-level dedup in cogs that archive Drive inputs, not to row-level dedup in an API service. Not applicable to this repo type."

  - rule: API-006
    reason: "WcsQaEvalRun is an append-only operator-internal table: it captures one row per (run_id, question_id) from the WCS Q&A agent's eval harness — agent answer, cited sources, judge score, judge reasoning, tool trace. Rows are produced by the operator-run eval suite (not by end users), and an eval run is evidence about agent behaviour rather than per-tenant content. The owner_id of the data the agent retrieved during the eval is preserved inside the tool_trace JSON, not on the row identity; adding an owner_id column would imply per-user partitioning that the harness does not model. Documented exemption per the API-006 remediation's operator-internal-table path. Revisit when/if the eval harness gains a per-tenant mode and rows become scoped to a single owner's content set."
    paths: [src/kaianolevine_api/models.py]
    models: [WcsQaEvalRun]

  - rule: API-006
    reason: "Operator bookkeeping, not anyone's content: dispatch claims that stop a watcher queuing the same Drive file twice, sent-once Spotify token reminders, detected-problem streaks, and published standards catalog versions. The fleet writes and reads these for itself; no user owns a row."
    paths: [src/kaianolevine_api/models.py]
    models: [DispatchClaim, SpotifyTokenReminder, SignalStreak, StandardsCatalog]

  - rule: API-006
    reason: "DisplayRules is the catalog's one set of display rules (a single row, id 1): how every entry's parts are written out as the title and artist shown, for every reader. It is configuration of the whole catalog, not anyone's content, so there is no owner to scope a row to. Writing it needs the catalog write scope at the route; reading it is public, like the catalog it renders (deejay-cog ADR-0008, decision 11)."
    paths: [src/kaianolevine_api/models.py]
    models: [DisplayRules]

  - rule: API-006
    reason: "The shared WCS knowledge graph built from lesson sources: canonical people, entities, their aliases, definitions and relations, and the per-source extractions, attributions and references they come from. It is shared vocabulary rather than per-user content; access to what a source says is scoped through the source (wcs_sources.owner_id and its grants), not by a column on each derived row."
    paths: [src/kaianolevine_api/models.py]
    models: [WcsInstructor, WcsInstructorAlias, WcsSourceExtraction, WcsEntity, WcsEntityAlias, WcsEntityDefinition, WcsEntityRelation, WcsSourceAttribution, WcsSourceReference, WcsDrillPurpose, WcsTechniqueRequirement]

  - rule: API-006
    reason: "Operator curation of the knowledge graph: global or per-source name, attribution and metadata corrections, and manual additions that no extraction produced. created_by records who made the fix for audit; the fix applies to everyone, so no user owns the row."
    paths: [src/kaianolevine_api/models.py]
    models: [WcsNameCorrection, WcsAttributionCorrection, WcsSourceMetadataCorrection, WcsAttributionAddition, WcsDrillPurposeAddition, WcsTechniqueRequirementAddition, WcsEntityRelationAddition]

  - rule: API-006
    reason: "The WCS wiki's build state, written by the curator cog: linker statements and references, facets, prose and its revisions, the materialized pages, their revisions and embeddings, and thin-entity notes. The wiki is one public site built from the shared knowledge graph; no user owns a page."
    paths: [src/kaianolevine_api/models.py]
    models: [WcsWikiStateMeta, WcsWikiStatement, WcsWikiReference, WcsWikiFacet, WcsWikiProse, WcsWikiProseRevision, WcsWikiPageRow, WcsWikiPageEmbedding, WcsWikiPageRevisionRow, WcsWikiThinRow]
